<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This site has moved</title>
<link rel="canonical" href="https://westerman-lab.github.io/">
<meta name="robots" content="noindex, follow">
<script>
  // GitHub Pages serves this file for any path that no longer exists here.
  // Carry the requested path over to the lab site, so old deep links such as
  // /research/ or /publications/ land on their counterparts rather than the
  // home page. /files/ is still served from this repo, so it never gets here.
  (function () {
    var base = "https://westerman-lab.github.io";
    var path = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(base + path);
  })();
</script>
<meta http-equiv="refresh" content="3; url=https://westerman-lab.github.io/">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         color: #3b3f45; background: #fff; padding: 2rem; }
  .card { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 .75rem; }
  a { color: #1c9e77; }
  p { margin: .5rem 0; }
  .muted { color: #6b7480; font-size: .9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>This site has moved</h1>
    <p>Kenny Westerman's research, publications, software, and CV now live on the
       Westerman Lab site.</p>
    <p><a href="https://westerman-lab.github.io/">westerman-lab.github.io</a></p>
    <p class="muted">Taking you there now.</p>
  </div>
</body>
</html>
